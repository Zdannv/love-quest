<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Love Quest · Owner</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffd6e7">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
  <header class="admin-top">
    <div class="brand">💖 Love Quest <small>OWNER</small></div>
    <button class="link-btn" id="btn-logout" hidden>keluar</button>
  </header>

  <main class="admin-main">
    <p class="admin-status" id="status" hidden></p>

    <section class="panel" id="view-login" hidden>
      <h1>Masuk sebagai owner</h1>
      <p class="muted">Pakai akun CMS yang sudah dijadikan admin di database.</p>
      <form id="form-login" class="form">
        <label>Email<input type="email" id="in-email" required autocomplete="email"></label>
        <label>Password<span class="pass-wrap"><input type="password" id="in-pass" required autocomplete="current-password"><button type="button" class="pass-eye" aria-label="Lihat password">👁️</button></span></label>
        <button class="btn" type="submit">Masuk</button>
      </form>
    </section>

    <div id="view-list" hidden>
      <section class="panel owner-summary" id="summary"></section>

      <section class="panel">
        <details id="new-box">
          <summary class="new-summary">➕ Tambah akun pembeli</summary>
          <form id="form-new" class="form new-form" autocomplete="off">
            <p class="muted small">Isi setelah pembayaran masuk. Pembeli nanti login di <b id="cms-url">/admin</b> pakai email & password ini.</p>
            <div class="grid2">
              <label>Email pembeli<input type="email" id="new-email" name="buyer-email" required autocomplete="off" data-lpignore="true" data-1p-ignore></label>
              <label>Password
                <span class="row nowrap"><input id="new-pass" name="buyer-password" required minlength="6" autocomplete="new-password" data-lpignore="true" data-1p-ignore><button type="button" class="btn ghost small-btn" id="btn-gen">🎲</button></span>
              </label>
            </div>
            <div class="grid2">
              <label>Nama pasangan (opsional)<input id="new-pasangan" maxlength="40" placeholder="contoh: Nadia"></label>
              <label>Nama pembeli (opsional)<input id="new-pengirim" maxlength="40" placeholder="contoh: Raka"></label>
            </div>
            <div class="grid2">
              <label>Paket
                <select id="new-plan">
                  <option value="basic">Love Quest (Rp49rb)</option>
                  <option value="custom">Love Quest Premium (Rp79rb)</option>
                </select>
              </label>
              <label>Aktif selama
                <select id="new-days">
                  <option value="forever">♾️ Selamanya (sekali bayar)</option>
                  <option value="30">30 hari</option>
                  <option value="90">3 bulan</option>
                  <option value="365">1 tahun</option>
                  <option value="0">Belum aktif (nunggu bayar)</option>
                </select>
              </label>
            </div>
            <label>Catatan (misal: bayar 24 Sep via QRIS)<input id="new-note"></label>
            <button class="btn" type="submit" id="btn-new">Bikin akun</button>
          </form>
          <div id="new-result" class="new-result" hidden></div>
        </details>
      </section>
      <section class="panel">
        <div class="row owner-filters">
          <input id="search" placeholder="Cari email, nama, atau kode…" autocomplete="off">
          <select id="filter">
            <option value="all">Semua</option>
            <option value="active">Aktif</option>
            <option value="soon">Habis ≤ 3 hari</option>
            <option value="expired">Berhenti</option>
          </select>
        </div>
      </section>
      <div id="couple-list" class="couple-list"></div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/owner.js"></script>
</body>
</html>
